name: mini-recon
on: { workflow_dispatch: {} }
jobs:
  recon:
    strategy: { fail-fast: false, matrix: { n: [1, 2, 3, 4, 5, 6] } }
    runs-on: [self-hosted, cv-mini]
    timeout-minutes: 5
    steps:
      - name: read-only host recon
        shell: bash
        run: |
          echo "host=$(hostname) user=$(whoami) uid=$(id -u)"
          echo "--- local users ---"; dscl . list /Users | grep -v '^_' | tr '\n' ' '; echo
          echo "--- admin group ---"; dscl . read /Groups/admin GroupMembership
          echo "--- homes ---"; ls -la /Users | awk '{print $1,$3,$NF}'
          echo "--- sudo ---"; sudo -n true 2>/dev/null && echo SUDO_OK || echo NO_SUDO
          echo "--- openclaw dirs ---"; ls -d /Users/*/.openclaw 2>&1
          echo "--- sshd_config (effective lines) ---"; grep -vhE '^\s*#|^\s*$' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/* 2>/dev/null
          echo "--- pam sshd ---"; cat /etc/pam.d/sshd 2>&1
          echo "--- sshd access group ---"; dscl . read /Groups/com.apple.access_ssh GroupMembership 2>&1; dscl . read /Groups/com.apple.access_ssh NestedGroups 2>&1
          echo "--- authorized_keys ---"; for d in /Users/*; do f="$d/.ssh/authorized_keys"; [ -r "$f" ] && { echo "$f:"; cut -c1-70 "$f"; }; done; true
          echo "--- non-apple launch daemons/agents ---"; ls /Library/LaunchDaemons /Library/LaunchAgents 2>/dev/null | grep -v '^com.apple' || true; for d in /Users/*/Library/LaunchAgents; do [ -d "$d" ] && { echo "$d:"; ls "$d"; }; done; true
          echo "--- remote access apps ---"; ls /Applications | grep -iE 'teamviewer|anydesk|rustdesk|splashtop|vnc|jump|parsec|screens|nomachine|remote' || echo none
          echo "--- listening tcp ---"; lsof -nP -iTCP -sTCP:LISTEN 2>/dev/null | awk 'NR>1{print $1, $3, $9}' | sort -u | head -40
          echo "--- sharing services ---"; for s in com.openssh.sshd com.apple.screensharing com.apple.smbd com.apple.RemoteDesktop.PrivilegeProxy; do launchctl print system/$s >/dev/null 2>&1 && echo "$s loaded"; done; true
          echo "--- tailscale ---"; /Applications/Tailscale.app/Contents/MacOS/Tailscale status --self --peers=false 2>&1 | head -2
          echo "--- ryan refs ---"; grep -ls 7191564227 /Users/*/.openclaw/openclaw.json /Users/*/.openclaw/workspace/lib/ops-alert.js 2>/dev/null || echo "none readable"
